# nginx vhost template for Meeting Assistant.
# Install as /etc/nginx/sites-available/meeting (symlink into sites-enabled/).
#
# This origin listens plain HTTP on :80, assuming TLS terminates at a CDN/load
# balancer in front. For automatic TLS on the host itself, see the Caddyfile.
# Apply changes with:  sudo nginx -t && sudo systemctl restart nginx
# (use restart, NOT reload — reload has silently missed new vhosts on some hosts).
server {
    listen 80;
    listen [::]:80;
    server_name meet.example.com;

    # Large audio uploads (app caps at 500MB; allow headroom)
    client_max_body_size 600M;
    client_body_timeout 600s;      # tolerate slow large uploads (default 60s)
    client_header_timeout 60s;
    send_timeout 600s;

    # FastAPI backend — SSE streaming + big uploads
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;            # stream SSE (chat/summary) unbuffered
        proxy_request_buffering off;    # stream big uploads straight to uvicorn
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;       # long transcription polling / SSE
        proxy_send_timeout 3600s;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
